# Hundkrets - Docker Compose for NixOS / home server
#
# Usage:
#   1. Set PUBLIC_URL (e.g. http://192.168.1.100 or https://hundkrets.example.com)
#   2. docker compose up -d
#   3. Open PUBLIC_URL in browser
#   4. Create admin at PUBLIC_URL/api/ (PocketBase Admin UI)
#
# For same-machine access: PUBLIC_URL=http://localhost
# For LAN access: PUBLIC_URL=http://YOUR_SERVER_IP

services:
  pocketbase:
    build:
      context: .
      dockerfile: docker/pocketbase/Dockerfile
    volumes:
      - pb_data:/pb/pb_data
    restart: unless-stopped
    # Expose for direct access (optional - remove if using nginx only)
    ports:
      - "8099:8090"

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      args:
        # URL the browser uses to reach PocketBase (same host:port as app, or separate)
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL:-http://localhost:8090}
    env_file:
      - app/.env
    environment:
      PORT: 3123
      # Server-side fetch to PocketBase: use internal Docker network (avoids hairpin NAT)
      POCKETBASE_SERVER_URL: http://pocketbase:8090
    restart: unless-stopped
    ports:
      - "3123:3123"
    depends_on:
      - pocketbase

  # Dev inbox: captures all SMTP mail, web UI + REST API for testing
  # Run: ./scripts/mailpit-certs.sh  (once) before first start
  # PocketBase Mail: host=mailpit|localhost, port=1025, TLS=Auto, AUTH=none
  # Web UI: http://localhost:8025 | API: http://localhost:8025/api/v1/messages
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    volumes:
      - ./mailpit-certs:/certs:ro
    environment:
      MP_SMTP_TLS_CERT: /certs/cert.pem
      MP_SMTP_TLS_KEY: /certs/key.pem
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
    profiles:
      - dev

volumes:
  pb_data:
